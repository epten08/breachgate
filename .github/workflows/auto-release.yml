# Publishes the GitHub Action to the Marketplace by tagging main and cutting a
# GitHub Release.
#
# This does NOT publish to npm. The tag below is pushed with the default
# GITHUB_TOKEN, and GitHub deliberately does not trigger workflows from events
# created with that token, so release.yml is not started by it. Publishing to
# npm is a separate, deliberate action:
#
#   gh workflow run release.yml --ref v<version> -f publish=true
#
# For a security tool that is arguably the right default: a human decides when
# a build reaches the registry.
name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".breachgateignore.example"

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Consumers pin an Action by its major version: `uses: epten08/breachgate@v2`.
      # Only the exact v2.0.0 tag was ever created, so that reference did not
      # resolve and the documented usage in the README was broken. Move the
      # floating major tag to this release, which is the standard convention for
      # actions published to the Marketplace.
      #
      # Runs on every release, not just new ones, so the pointer cannot drift.
      - name: Move floating major version tag
        run: |
          version="${{ steps.version.outputs.version }}"
          major="v${version%%.*}"
          echo "pointing $major at v$version"
          git tag -f "$major"
          git push origin -f "$major"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
