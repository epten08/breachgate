name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artifacts. Leave false for a dry run.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/breach-gate

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # The tag is the version users will install. If it disagrees with
      # package.json we would publish something other than what was tagged.
      # auto-release.yml derives the tag from package.json so they match by
      # construction, but a hand-pushed tag can drift.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck

      # Accuracy gates. These were missing from the release path, so a build
      # whose precision gate had never run could be published. Precision is
      # asserted at exactly 1.0, so a single false positive blocks the release.
      # Ordered first for the same reason as in ci.yml: if the tool cannot stay
      # quiet on a clean target, nothing else about the release matters.
      - name: Negative controls (clean targets must stay SAFE)
        run: npm run test:controls

      - name: Precision and recall measurement
        run: npm run precision

      - name: Upload precision report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-precision-report
          path: security-reports/precision.json

      - run: npm test
      - run: npm run test:cli
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run sbom -- sbom.cdx.json
      - run: npm pack --dry-run

      - name: Upload release SBOM preview
        uses: actions/upload-artifact@v4
        with:
          name: sbom-preview
          path: sbom.cdx.json

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run sbom -- sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-sbom
          path: sbom.cdx.json
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

