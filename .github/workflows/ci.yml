name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck, test, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Negative controls run BEFORE anything else. If the tool cannot stay
      # quiet on a clean target, nothing else about the build matters.
      - name: Negative controls (clean targets must stay SAFE)
        run: npm run test:controls

      # Accuracy gate. Precision must be exactly 1.0; a single false positive
      # fails the build. The measured numbers are published in the README.
      - name: Precision and recall measurement
        run: npm run precision

      - name: Upload precision report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-report
          path: security-reports/precision.json
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:cli
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run sbom -- security-reports/sbom.cdx.json
      - run: npm pack --dry-run

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: security-reports/sbom.cdx.json

  demo-scan:
    name: Demo API scan smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start demo API
        shell: bash
        run: |
          npm run demo &
          echo $! > demo-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      # Positive control: the deliberately vulnerable demo must come back UNSAFE
      # with real proofs. It is no longer the only behavioural check in CI, and
      # it is no longer treated as sufficient: the negative controls and the
      # precision gate in the verify job are what catch false positives.
      #
      # This uses demo/ai-tests.json via scanners.ai.replayTests, so no model or
      # API key is needed and the run is deterministic. Exit 1 is the expected
      # outcome, so the step must not fail the job on it.
      - name: Run Breach Gate demo smoke scan
        run: |
          set +e
          node dist/cli/index.js scan \
            --ci \
            --workdir demo \
            --config security.config.yml \
            --offline \
            --format json,markdown,sarif \
            --output "$GITHUB_WORKSPACE/security-reports/demo"
          code=$?
          set -e
          echo "breach-gate exit code: $code"
          if [ "$code" -ge 2 ]; then
            echo "ERROR: exit $code indicates a crash or config error, not a verdict" >&2
            exit 1
          fi

      # The demo API is exploitable on purpose. A SAFE verdict here means the
      # detectors stopped working, which is exactly the regression that shipped
      # in v1 and went unnoticed.
      - name: Assert the demo is reported as UNSAFE with proofs
        run: |
          report=security-reports/demo/security-report.json
          test -f "$report" || { echo "no JSON report produced" >&2; exit 1; }
          node -e "
            const r = require('./' + process.argv[1]);
            const verdict = r.verdict.status;
            const confirmed = r.findings.filter(f => (f.proofs || []).length > 0);
            const proofs = [...new Set(confirmed.flatMap(f => f.proofs))].sort();
            console.log('verdict:', verdict);
            console.log('confirmed findings:', confirmed.length);
            console.log('proof types:', proofs.join(', ') || '(none)');
            if (verdict !== 'UNSAFE') {
              console.error('FAIL: expected UNSAFE, got ' + verdict);
              process.exit(1);
            }
            if (confirmed.length < 3) {
              console.error('FAIL: expected at least 3 confirmed exploits, got ' + confirmed.length);
              process.exit(1);
            }
            if (confirmed.some(f => !f.proofExcerpt)) {
              console.error('FAIL: a confirmed finding has no proof excerpt to verify');
              process.exit(1);
            }
          " "$report"

      - name: Stop demo API
        if: always()
        shell: bash
        run: |
          if [ -f demo-api.pid ]; then
            kill "$(cat demo-api.pid)" || true
          fi

      - name: Upload demo scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-security-reports
          path: security-reports/demo/
