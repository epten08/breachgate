name: False Positive Report
description: The scanner flagged something that is not a real vulnerability
labels: ["false-positive", "scanner-quality"]
body:
  - type: markdown
    attributes:
      value: |
        False positive reports directly improve scanner accuracy. Thank you for taking the time to file one.

  - type: input
    id: version
    attributes:
      label: Breach Gate version
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: verdict_impact
    attributes:
      label: Did this finding block a deployment?
      description: >-
        A finding reported as CONFIRMED returns UNSAFE and blocks the deploy. That is the most
        serious class of false positive and gets priority. A REVIEW_REQUIRED or SAFE finding is
        noise, which matters less but is still worth fixing.
      options:
        - "Yes: reported as a confirmed exploit, verdict was UNSAFE"
        - "No: verdict was REVIEW_REQUIRED"
        - "No: verdict was SAFE, the finding was just noise in the report"
    validations:
      required: true

  - type: dropdown
    id: scanner
    attributes:
      label: Which scanner produced the finding?
      options:
        - AI Security Tester
        - Trivy Static
        - OWASP ZAP
    validations:
      required: true

  - type: input
    id: finding_title
    attributes:
      label: Finding title
      description: Copy from the report.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      placeholder: "e.g. POST /api/accounting/chart-of-accounts"

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the report
      description: >-
        Paste the whole evidence block. For a confirmed finding this includes the "Proof" and
        "Proof excerpt" lines, which are the specific claim we need to disprove.
      render: text
    validations:
      required: true

  - type: textarea
    id: why_fp
    attributes:
      label: Why is this a false positive?
      description: Explain what the response actually means and why it does not indicate a vulnerability.
    validations:
      required: true

  - type: dropdown
    id: root_cause
    attributes:
      label: Root cause (best guess)
      options:
        - A proof pattern matched text that a healthy response legitimately contains
        - The proof signal was also present in the benign baseline and should have been filtered
        - 401/403 response incorrectly classified as an auth bypass
        - 404 route-not-found treated as vulnerable
        - Timing false positive (slow network, not blind injection)
        - Reported category does not match what the proof actually shows
        - Finding is real but the feasibility score is too high
        - Other
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: >-
        Optional. The most useful thing you can give us is a minimal endpoint that reproduces it,
        because it goes straight into the precision corpus in test/corpus/targets.ts as a clean
        case and the detector gets fixed against it.
