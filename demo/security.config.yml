# Breach Gate configuration for the demo vulnerable API.
#
# Run from the repository root:
#   npm run demo                 # start the API on :3000
#   npm run scan:demo            # scan it, no API key required
#
# The AI scanner replays a checked-in set of test cases (demo/ai-tests.json)
# instead of calling a model, so this is deterministic and free to run.

version: "1.0"

target:
  baseUrl: "http://localhost:3000"
  healthEndpoint: "/health"
  healthTimeout: 60000

  endpoints:
    - path: "/api/login"
      method: "POST"
      body:
        username: "test"
        password: "test"
    - path: "/api/users"
      method: "GET"
      params:
        id: "admin"
    - path: "/api/search"
      method: "GET"
      params:
        q: "test"
    - path: "/api/execute"
      method: "POST"
      body:
        command: "echo hello"
    - path: "/api/debug"
      method: "GET"
    - path: "/api/file"
      method: "GET"
      params:
        path: "/tmp/report.txt"
    - path: "/api/data"
      method: "GET"
      params:
        id: "1"

auth:
  type: none

scanners:
  # Off by default so the demo runs without Trivy or Docker installed.
  static:
    enabled: false

  # Off by default so the demo runs without ZAP installed.
  dynamic:
    enabled: false

  ai:
    enabled: true
    provider: "ollama"
    model: "llama3"
    maxTests: 20
    # Replay checked-in test cases rather than calling a model.
    # Delete this line to have the configured provider generate fresh cases.
    replayTests: "./ai-tests.json"

# The demo runs on localhost with no CVE-bearing findings, so there is nothing
# for EPSS or KEV to enrich. Disabled to keep the demo fully offline.
intel:
  enabled: false

thresholds:
  failOn: "HIGH"
  warnOn: "MEDIUM"

safety:
  profile: "safe-active"
  allowedHosts:
    - localhost
    - 127.0.0.1
  maxRequestsPerSecond: 0

reporting:
  formats:
    - "markdown"
    - "json"
  outputDir: "./reports"
  includeEvidence: true
